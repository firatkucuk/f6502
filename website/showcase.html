<!doctype html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Showcase — f6502</title>
  <meta name="description" content="A C64Script showcase compiled in your browser and running live on the f6502 emulator.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&family=VT323&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .pg-head { max-width: var(--max-w); margin: 0 auto; padding: 2.5rem 1.5rem 1rem; }
    .hero-badge { display: inline-flex; align-items: center; padding: 6px 14px;
                  background: rgba(106, 191, 198, 0.12); border: 1px solid rgba(106, 191, 198, 0.3);
                  border-radius: 20px; font-family: var(--font-pixel); font-size: 8px;
                  color: var(--accent); letter-spacing: 0.1em; text-decoration: none; }
    .pg-head h1 { font-family: var(--font-pixel); font-size: 1.1rem; margin: 0.75rem 0 0.5rem; }
    .pg-head p { color: var(--text-muted); margin: 0; }
    .sc { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 1.25rem;
          max-width: var(--max-w); margin: 0 auto; padding: 0 1.5rem 3rem; }
    @media (max-width: 900px) { .sc { grid-template-columns: minmax(0, 1fr); } }
    .sc-crt { background: #000; border: 1px solid var(--border-2); border-radius: 10px; padding: 12px; }
    .sc-crt canvas { display: block; width: 100%; aspect-ratio: 384 / 272; image-rendering: pixelated;
                     background: #000; }
    .sc-status { margin-top: 0.6rem; min-height: 1.4em; font-family: var(--font-mono);
                 font-size: 0.8rem; color: var(--text-muted); }
    .sc-hint { margin: 0.4rem 0 0; font-size: 0.82rem; color: var(--text-dim); }
    .sc-hint:empty { display: none; }
    .sc-source { position: relative; max-height: 560px; overflow: auto; }
    .sc-source pre { margin: 0; background: none; border: 0; padding: 0; }
    .sc-source code { font-family: var(--font-mono); font-size: 0.8rem; line-height: 1.6; color: #c0c4e0; }
    .sc-source .token.comment { color: #454770; font-style: italic; }
    .sc-source .token.keyword { color: #887ecb; }
    .sc-source .token.attr-name { color: #c9934a; }
    .sc-source .token.class-name { color: #6abfc6; }
    .sc-source .token.property { color: #50b8c8; }
    .sc-source .token.function { color: #a090e8; }
    .sc-source .token.boolean, .sc-source .token.number { color: #c9d487; }
    .sc-source .token.string { color: #9ae29b; }
    .sc-source .token.operator { color: #6070a0; }
    .sc-source .token.punctuation { color: #4a4d70; }
  </style>
</head>

<div class="page">
  <header class="pg-head">
    <a class="hero-badge" href="showcases.html">&larr; SHOWCASES</a>
    <h1 id="showcase-title">Loading…</h1>
    <p id="showcase-blurb"></p>
  </header>

  <main class="sc">
    <section aria-label="Emulator">
      <div class="sc-crt emu-crt" id="showcase-crt">
        <canvas id="showcase-canvas" width="384" height="272" tabindex="0"
                aria-label="A Commodore 64 screen running the showcase"></canvas>
        <div class="emu-bar" role="toolbar" aria-label="Emulator controls">
          <button type="button" id="showcase-pause" title="Pause" aria-label="Pause" aria-pressed="false" disabled>
            <svg class="off-state" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M4 2.5h3v11H4zM9 2.5h3v11H9z"/></svg>
            <svg class="on-state" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M5 3.2v9.6a.5.5 0 0 0 .76.43l7.6-4.8a.5.5 0 0 0 0-.86l-7.6-4.8A.5.5 0 0 0 5 3.2z"/></svg>
          </button>
          <button type="button" id="showcase-reboot" title="Reboot" aria-label="Reboot" disabled>
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.6-3.7"/><path d="M13 2.5v3h-3"/></svg>
          </button>
          <button type="button" id="showcase-sound" title="Mute" aria-label="Mute" aria-pressed="false" hidden>
            <svg class="off-state" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 6.5h2.5L8.5 3.5v9L5 9.5H2.5z" fill="currentColor"/><path d="M11 6a3 3 0 0 1 0 4M12.8 4.3a5.5 5.5 0 0 1 0 7.4"/></svg>
            <svg class="on-state" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 6.5h2.5L8.5 3.5v9L5 9.5H2.5z" fill="currentColor"/><path d="M11 6.2l3.5 3.6M14.5 6.2L11 9.8"/></svg>
          </button>
          <button type="button" id="showcase-fullscreen" title="Fullscreen" aria-label="Fullscreen" aria-pressed="false">
            <svg class="off-state" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10"/></svg>
            <svg class="on-state" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2.5V6H2.5M13.5 6H10V2.5M10 13.5V10h3.5M2.5 10H6v3.5"/></svg>
          </button>
        </div>
      </div>
      <div id="showcase-status" class="sc-status" role="status" aria-live="polite">Starting the emulator…</div>
      <p id="showcase-hint" class="sc-hint"></p>
    </section>

    <section aria-label="Source">
      <div class="terminal">
        <div class="terminal-bar">
          <span class="terminal-dot red"></span>
          <span class="terminal-dot yellow"></span>
          <span class="terminal-dot green"></span>
          <span class="terminal-title" id="showcase-file">showcase.c64s</span>
          <span class="terminal-actions">
            <a class="term-btn try" id="showcase-try" href="playground.html" target="_blank" rel="noopener"
               title="Try it in the playground" aria-label="Try it in the playground (opens in a new tab)">
              <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M5 3.2v9.6a.5.5 0 0 0 .76.43l7.6-4.8a.5.5 0 0 0 0-.86l-7.6-4.8A.5.5 0 0 0 5 3.2z"/></svg>
            </a>
          </span>
        </div>
        <div class="terminal-body sc-source">
          <pre><code id="showcase-source"></code></pre>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div>
      <div class="footer-brand">f6502</div>
